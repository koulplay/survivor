name: github-ci
on: [push]
jobs:
  look:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Test
        run: ctest --test-dir build --output-on-failure