<svg xmlns="http://www.w3.org/2000/svg" width="880" height="570" viewBox="0 0 880 570" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Один тик: кто увидит мёртвого врага</title><desc id="d">Двенадцать шагов Update по порядку. Враг сегодня умирает только в UpdateBullets, после всех функций, которые не проверяют dead; окно, где мёртвый ещё в векторе, — от UpdateBullets до erase_if.</desc><rect x="0" y="0" width="880" height="570" rx="14" fill="#1d2230"/>
<text x="24" y="34" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#e8ebf2" font-weight="bold" text-anchor="start">Один тик: кто увидит мёртвого врага</text>
<text x="24" y="56" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#9aa4b8" font-weight="normal" text-anchor="start">Порядок в Update (update.cpp, строки 283–301). Убитый лежит в world.enemies до erase_if в конце тика.</text>
<text x="34" y="104" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12.5" fill="#9aa4b8" font-weight="bold" text-anchor="start">функция</text>
<text x="306" y="104" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12.5" fill="#9aa4b8" font-weight="bold" text-anchor="start">что делает с врагами</text>
<text x="558" y="104" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12.5" fill="#9aa4b8" font-weight="bold" text-anchor="start">dead?</text>
<text x="666" y="104" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12.5" fill="#9aa4b8" font-weight="bold" text-anchor="start">если враг уже мёртв</text>
<rect x="18" y="326" width="844" height="154" rx="8" fill="#7bd389" fill-opacity="0.07" stroke="#7bd389" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="24" y="118" width="832" height="30" rx="4" fill="#262d3f"/>
<text x="34" y="138" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e8ebf2" font-weight="normal" text-anchor="start"> 1  world.game_time += kTick</text>
<text x="306" y="138" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#9aa4b8" font-weight="normal" text-anchor="start">—</text>
<text x="34" y="168" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e8ebf2" font-weight="normal" text-anchor="start"> 2  UpdateSpawn</text>
<text x="306" y="168" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e8ebf2" font-weight="normal" text-anchor="start">добавляет нового</text>
<rect x="24" y="178" width="832" height="30" rx="4" fill="#262d3f"/>
<text x="34" y="198" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e8ebf2" font-weight="normal" text-anchor="start"> 3  UpdatePlayer</text>
<text x="306" y="198" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#9aa4b8" font-weight="normal" text-anchor="start">—</text>
<text x="34" y="228" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e8ebf2" font-weight="normal" text-anchor="start"> 4  UpdateEnemies</text>
<text x="306" y="228" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e8ebf2" font-weight="normal" text-anchor="start">двигает к игроку</text>
<text x="558" y="228" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffd166" font-weight="bold" text-anchor="start">нет</text>
<text x="666" y="228" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffd166" font-weight="normal" text-anchor="start">сдвинется — не важно</text>
<rect x="24" y="238" width="832" height="30" rx="4" fill="#262d3f"/>
<text x="34" y="258" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e8ebf2" font-weight="normal" text-anchor="start"> 5  UpdateSeparation</text>
<text x="306" y="258" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e8ebf2" font-weight="normal" text-anchor="start">толкает соседей</text>
<text x="558" y="258" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffd166" font-weight="bold" text-anchor="start">нет</text>
<text x="666" y="258" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffd166" font-weight="normal" text-anchor="start">толкнёт ещё раз — мелочь</text>
<text x="34" y="288" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e8ebf2" font-weight="normal" text-anchor="start"> 6  UpdateContactDamage</text>
<text x="306" y="288" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e8ebf2" font-weight="normal" text-anchor="start">бьёт игрока (MaxContactDamage)</text>
<text x="558" y="288" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ff6b6b" font-weight="bold" text-anchor="start">нет</text>
<text x="666" y="288" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ff6b6b" font-weight="bold" text-anchor="start">ударит игрока</text>
<rect x="24" y="298" width="832" height="30" rx="4" fill="#262d3f"/>
<text x="34" y="318" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e8ebf2" font-weight="normal" text-anchor="start"> 7  UpdateShooting</text>
<text x="306" y="318" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e8ebf2" font-weight="normal" text-anchor="start">ищет цель (NearestEnemyPos)</text>
<text x="558" y="318" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ff6b6b" font-weight="bold" text-anchor="start">нет</text>
<text x="666" y="318" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ff6b6b" font-weight="bold" text-anchor="start">пистолет выстрелит в него</text>
<text x="34" y="348" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e8ebf2" font-weight="normal" text-anchor="start"> 8  UpdateBullets</text>
<text x="306" y="348" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e8ebf2" font-weight="normal" text-anchor="start">попадания; ★ смерть — стр. 271</text>
<text x="558" y="348" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7bd389" font-weight="bold" text-anchor="start">да</text>
<text x="666" y="348" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7bd389" font-weight="normal" text-anchor="start">пуля пролетит мимо</text>
<rect x="24" y="358" width="832" height="30" rx="4" fill="#262d3f"/>
<text x="34" y="378" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e8ebf2" font-weight="normal" text-anchor="start"> 9  UpdateExp</text>
<text x="306" y="378" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#9aa4b8" font-weight="normal" text-anchor="start">—</text>
<text x="34" y="408" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e8ebf2" font-weight="normal" text-anchor="start">10  UpdateDamagePopups</text>
<text x="306" y="408" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#9aa4b8" font-weight="normal" text-anchor="start">—</text>
<rect x="24" y="418" width="832" height="30" rx="4" fill="#262d3f"/>
<text x="34" y="438" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e8ebf2" font-weight="normal" text-anchor="start">11  UpdateGameState</text>
<text x="306" y="438" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#9aa4b8" font-weight="normal" text-anchor="start">—</text>
<text x="34" y="468" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e8ebf2" font-weight="normal" text-anchor="start">12  std::erase_if(world.enemies, …)</text>
<text x="306" y="468" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e8ebf2" font-weight="normal" text-anchor="start">убирает мёртвых</text>
<text x="584" y="348" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9aa4b8" font-weight="normal" text-anchor="start">стр. 248</text>
<text x="24" y="506" font-size="13" text-anchor="start"><tspan font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" fill="#7bd389" font-weight="bold">Пунктир — окно «мёртв, но ещё в векторе» сегодня: </tspan><tspan font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" fill="#e8ebf2" font-weight="normal">в нём врагов читают только пули, и они проверяют dead.</tspan></text>
<text x="24" y="530" font-size="13" text-anchor="start"><tspan font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" fill="#ffd166" font-weight="bold">Второй источник смерти выше строки 8 </tspan><tspan font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" fill="#e8ebf2" font-weight="normal">— и мёртвого увидят все строки между ним и erase_if.</tspan></text>
<text x="24" y="554" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9aa4b8" font-weight="normal" text-anchor="start">Код от 24.10.2026: dead проверяет только UpdateBullets; MaxContactDamage, NearestEnemyPos, UpdateSeparation, UpdateEnemies — нет.</text></svg>
