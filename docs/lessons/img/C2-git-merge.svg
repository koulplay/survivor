<line x1="740" y1="142" x2="740" y2="171" stroke="#6aa9ff"/>
<rect x="520" y="223" width="50" height="24" rx="6" fill="#c9a7ff" fill-opacity="0.15" stroke="#c9a7ff"/>
<text x="545" y="240" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#c9a7ff" text-anchor="middle" font-weight="bold">aura</text>
<line x1="570" y1="235" x2="598" y2="235" stroke="#c9a7ff"/>
<g font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12.5" fill="#e8ebf2">
