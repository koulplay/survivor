<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Слияние: перемотка и коммит слияния</title>
<desc id="d">Слева перемотка: master стоял на dc76a41, ветка c2-ci ушла на один коммит afdf17f; git merge c2-ci просто передвигает ярлык master на afdf17f, нового коммита нет. Справа коммит слияния: от afdf17f обе ветки ушли вперёд — master на bc3d9af, aura на 39547e7; git merge aura делает коммит e7139a0 с двумя родителями. Обе ветки меняли строку hp, поэтому сначала был конфликт.</desc>
<defs>
  <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b8"/></marker>
</defs>
<rect x="0" y="0" width="880" height="330" rx="14" fill="#1d2230"/>
<g font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif">
<text x="24" y="34" font-size="18" fill="#e8ebf2" font-weight="bold">Слияние: перемотка и коммит слияния</text>
<text x="24" y="56" font-size="13" fill="#9aa4b8">Хэши — из прогона Практики: Г4 слева, Г5 справа. Ветка — ярлык на коммит.</text>
<line x1="440" y1="76" x2="440" y2="300" stroke="#9aa4b8" stroke-opacity="0.35"/>
<text x="24" y="90" font-size="14.5" fill="#e8ebf2" font-weight="bold">Перемотка (fast-forward), Г4</text>
<text x="464" y="90" font-size="14.5" fill="#e8ebf2" font-weight="bold">Коммит слияния, Г5</text>
</g>

<!-- left panel -->
<line x1="80" y1="185" x2="320" y2="185" stroke="#6aa9ff" stroke-width="3"/>
<g stroke-width="3">
  <circle cx="80" cy="185" r="10" fill="#1d2230" stroke="#6aa9ff"/>
  <circle cx="200" cy="185" r="10" fill="#1d2230" stroke="#6aa9ff"/>
  <circle cx="320" cy="185" r="10" fill="#6aa9ff" stroke="#6aa9ff"/>
</g>
<g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#9aa4b8" text-anchor="middle">
  <text x="80" y="214">803fffc</text>
  <text x="200" y="214">dc76a41</text>
  <text x="320" y="214">afdf17f</text>
</g>
<!-- ghost master tag -->
<rect x="168" y="118" width="64" height="24" rx="6" fill="none" stroke="#9aa4b8" stroke-dasharray="4 3"/>
<text x="200" y="135" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#9aa4b8" text-anchor="middle">master</text>
<line x1="200" y1="142" x2="200" y2="172" stroke="#9aa4b8" stroke-dasharray="4 3"/>
<path d="M234,130 C260,120 268,120 284,128" fill="none" stroke="#9aa4b8" stroke-width="1.8" marker-end="url(#g)"/>
<!-- new master tag -->
<rect x="288" y="118" width="64" height="24" rx="6" fill="#6aa9ff" fill-opacity="0.15" stroke="#6aa9ff"/>
<text x="320" y="135" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#6aa9ff" text-anchor="middle" font-weight="bold">master</text>
<line x1="320" y1="142" x2="320" y2="172" stroke="#6aa9ff"/>
<!-- c2-ci tag -->
<rect x="292" y="228" width="56" height="24" rx="6" fill="#c9a7ff" fill-opacity="0.15" stroke="#c9a7ff"/>
<text x="320" y="245" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#c9a7ff" text-anchor="middle" font-weight="bold">c2-ci</text>
<g font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12.5" fill="#e8ebf2">
  <text x="24" y="278">В master ничего нового — git просто передвинул</text>
  <text x="24" y="296">ярлык master на afdf17f. Нового коммита нет.</text>
</g>

