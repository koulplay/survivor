<text x="40" y="488" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12.5" fill="#9aa4b8" font-weight="normal" text-anchor="start">Объектов сколько угодно — таблица у класса одна. Новое животное = новая таблица, цикл тот же.</text></svg>
