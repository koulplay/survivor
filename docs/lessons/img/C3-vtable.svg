<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Ферма в памяти: указатели, объекты, таблицы функций</title><desc id="d">Вектор хранит unique_ptr по 8 байт; объекты Hen (16 байт) и Cow (8 байт) лежат в куче; в каждом объекте vptr указывает на таблицу функций своего класса; вызов Tick идёт через ячейку таблицы.</desc><defs><marker id="m2ec4b6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2ec4b6"/></marker><marker id="m4c9aff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4c9aff"/></marker><marker id="mffd166" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs><rect x="0" y="0" width="880" height="520" rx="14" fill="#1d2230"/><text x="24" y="34" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#e8ebf2" font-weight="bold" text-anchor="start">Ферма в памяти: указатели → объекты → таблицы функций</text>
<text x="24" y="56" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#9aa4b8" font-weight="normal" text-anchor="start">Размеры и таблицы — из GCC 16.2 (-fdump-lang-class), x86-64. Адресов нет: важны только стрелки.</text>
