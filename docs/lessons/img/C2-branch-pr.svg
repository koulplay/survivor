<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Ветка, pull request, слияние</title>
<desc id="d">Основная ветка master идёт сверху. От неё отходит ветка шага c2-ci с тремя коммитами; CI проверяет каждый push: первый зелёный, второй красный, третий зелёный. Pull request собирает изменения, результат CI и список самопроверки; слияние в master — только после зелёного CI.</desc>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9aa4b8"/>
  </marker>
</defs>
<rect x="0" y="0" width="880" height="400" rx="14" fill="#1d2230"/>
<text x="24" y="34" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#e8ebf2" font-weight="bold">Ветка, pull request, слияние</text>
<text x="24" y="56" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#9aa4b8">Шаг живёт в своей ветке; в основную ветку попадает только то, у чего зелёный CI.</text>

<!-- master -->
<line x1="40" y1="120" x2="850" y2="120" stroke="#6aa9ff" stroke-width="3"/>
<text x="40" y="100" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#6aa9ff" font-weight="bold">master</text>
<text x="112" y="100" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12.5" fill="#9aa4b8">после каждого слияния собирается</text>
<circle cx="90" cy="120" r="9" fill="#1d2230" stroke="#6aa9ff" stroke-width="3"/>
<circle cx="170" cy="120" r="9" fill="#1d2230" stroke="#6aa9ff" stroke-width="3"/>
<circle cx="700" cy="120" r="11" fill="#6aa9ff" stroke="#6aa9ff" stroke-width="3"/>
<text x="700" y="100" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12.5" fill="#e8ebf2" text-anchor="middle">слияние</text>
<circle cx="790" cy="120" r="9" fill="#1d2230" stroke="#6aa9ff" stroke-width="3"/>

<!-- branch -->
<path d="M170,120 C200,120 200,220 240,220 L560,220 C640,220 650,120 700,120" fill="none" stroke="#c9a7ff" stroke-width="3"/>
<text x="212" y="250" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#c9a7ff" font-weight="bold">c2-ci</text>
<text x="40" y="168" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#c9a7ff">git switch -c c2-ci</text>

<circle cx="300" cy="220" r="9" fill="#1d2230" stroke="#c9a7ff" stroke-width="3"/>
<circle cx="410" cy="220" r="9" fill="#1d2230" stroke="#c9a7ff" stroke-width="3"/>
<circle cx="520" cy="220" r="9" fill="#1d2230" stroke="#c9a7ff" stroke-width="3"/>

<!-- CI badges above branch commits -->
<g font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12">
  <circle cx="300" cy="186" r="11" fill="#7bd389"/>
  <path d="M294,186 l4,4 l8,-9" fill="none" stroke="#1d2230" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="410" cy="186" r="11" fill="#ff6b6b"/>
  <path d="M405,181 l10,10 M415,181 l-10,10" fill="none" stroke="#1d2230" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="520" cy="186" r="11" fill="#7bd389"/>
  <path d="M514,186 l4,4 l8,-9" fill="none" stroke="#1d2230" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="300" y="250" fill="#9aa4b8" text-anchor="middle">push → CI</text>
  <text x="410" y="250" fill="#ff6b6b" text-anchor="middle">тест упал</text>
  <text x="410" y="266" fill="#9aa4b8" text-anchor="middle">master не задет</text>
  <text x="520" y="250" fill="#9aa4b8" text-anchor="middle">исправил → CI</text>
</g>

<!-- PR bracket -->
<rect x="270" y="286" width="290" height="84" rx="10" fill="#c9a7ff" fill-opacity="0.08" stroke="#c9a7ff" stroke-opacity="0.6"/>
<text x="286" y="310" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13.5" fill="#c9a7ff" font-weight="bold">pull request: c2-ci → master</text>
<text x="286" y="331" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12.5" fill="#e8ebf2">изменения шага + результат CI +</text>
<text x="286" y="350" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12.5" fill="#e8ebf2">список самопроверки</text>

<!-- merge condition + self-check list -->
<rect x="590" y="244" width="266" height="134" rx="10" fill="#7bd389" fill-opacity="0.08" stroke="#7bd389" stroke-opacity="0.7"/>
<text x="606" y="267" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7bd389" font-weight="bold">Сливаем, когда у последнего</text>
<text x="606" y="285" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7bd389" font-weight="bold">коммита галочка и выполнено:</text>
<g font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12.5" fill="#e8ebf2">
  <text x="606" y="307">☐ собирается без предупреждений</text>
  <text x="606" y="325">☐ тесты зелёные</text>
  <text x="606" y="343">☐ нет // TEMP</text>
  <text x="606" y="361">☐ коммиты по рецепту</text>
</g>

<text x="24" y="392" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9aa4b8">Запрет «слить без галочки» GitHub Free даёт только публичным репозиториям; в приватном его держишь ты. Урок C2, раздел 2.2.</text>
</svg>
