<text x="714.0" y="299" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9aa4b8" font-weight="normal" text-anchor="middle">120</text>
<text x="468" y="384" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7bd389" font-weight="bold" text-anchor="start">Heavy: 120 ≤ 100 + 25 — попал</text>
<text x="468" y="406" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#9aa4b8" font-weight="normal" text-anchor="start">Light: 120 &gt; 100 + 5 — мимо</text>
<text x="24" y="454" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12.5" fill="#e8ebf2" font-weight="normal" text-anchor="start">Ровно на границе raylib 6.0 считает касание попаданием: в обеих функциях сравнение &lt;= (src/rshapes.c).</text></svg>
