<text x="40" y="384" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ff6b6b" font-weight="bold" text-anchor="start">Heavy: 120 &gt; 100 — мимо, хотя задевает круг</text>
<text x="40" y="406" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#9aa4b8" font-weight="normal" text-anchor="start">Light: 120 &gt; 100 — мимо</text>
