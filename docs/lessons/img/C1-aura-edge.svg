<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Где кончается аура</title><desc id="d">Два способа решить, попал ли враг под ауру радиуса 100. По центру: Heavy в 120 пикс не попадает, хотя задевает нарисованный круг. По краю: Heavy попадает (120 ≤ 125), Light в 120 пикс — нет (120 &gt; 105).</desc><rect x="0" y="0" width="880" height="470" rx="14" fill="#1d2230"/>
<text x="24" y="34" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#e8ebf2" font-weight="bold" text-anchor="start">Где кончается аура</text>
<text x="24" y="56" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#9aa4b8" font-weight="normal" text-anchor="start">Радиус ауры 100 — пример. Оба врага в 120 пикс от центра игрока; радиусы и цвета — из kEnemyDefs.</text>
<rect x="24" y="72" width="404" height="356" rx="8" fill="#262d3f" stroke="#3a435a" stroke-width="1"/>
<text x="40" y="98" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#e8ebf2" font-weight="bold" text-anchor="start">По центру врага</text>
<text x="40" y="120" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#9aa4b8" font-weight="normal" text-anchor="start">CheckCollisionPointCircle(e.pos, p, R)</text>
<circle cx="226.0" cy="252" r="100" fill="#ffd166" fill-opacity="0.12" stroke="#ffd166" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="226.0" y="148" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffd166" font-weight="normal" text-anchor="middle">R = 100</text>
<rect x="210.0" y="236" width="32" height="32" rx="2" fill="#e8ebf2"/>
<text x="226.0" y="256" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1d2230" font-weight="bold" text-anchor="middle">игрок</text>
