<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Что происходит после git push</title>
<desc id="d">Коммит уходит на GitHub; GitHub берёт файл workflow из этого коммита и для каждой задачи поднимает чистую машину — windows-2025 с MSYS2 и ubuntu-24.04 с apt. На каждой пять шагов: checkout, инструменты, настройка CMake, сборка, ctest. Шаг с кодом возврата не 0 — красный, следующие пропускаются, у коммита крест.</desc>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9aa4b8"/>
  </marker>
</defs>
<rect x="0" y="0" width="880" height="560" rx="14" fill="#1d2230"/>
<text x="24" y="34" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#e8ebf2" font-weight="bold">Что происходит после git push</text>
<text x="24" y="56" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#9aa4b8">CI проверяет коммит, а не твою папку: каждая задача — на своей чистой машине, шаг за шагом.</text>

<!-- Твой компьютер -->
<rect x="24" y="84" width="196" height="246" rx="10" fill="#262d3f" stroke="#343e57"/>
<text x="38" y="108" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#e8ebf2" font-weight="bold">Твой компьютер</text>
<rect x="38" y="122" width="168" height="28" rx="6" fill="#1d2230" stroke="#6aa9ff"/>
<text x="122" y="141" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#6aa9ff" text-anchor="middle">git push</text>
<text x="38" y="176" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7bd389" font-weight="bold">уходит:</text>
<text x="38" y="196" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e8ebf2">коммит — и только он</text>
<text x="38" y="226" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffd166" font-weight="bold">не уходит:</text>
<text x="38" y="246" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#e8ebf2">cmake-build-debug/</text>
<text x="38" y="266" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e8ebf2">файлы без git add</text>
<text x="38" y="286" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e8ebf2">программы и библиотеки,</text>
<text x="38" y="304" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e8ebf2">что стоят только у тебя</text>

<line x1="222" y1="160" x2="246" y2="160" stroke="#9aa4b8" stroke-width="1.6" marker-end="url(#arr)"/>

<!-- GitHub -->
<rect x="250" y="84" width="176" height="246" rx="10" fill="#262d3f" stroke="#343e57"/>
<text x="264" y="108" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#e8ebf2" font-weight="bold">GitHub</text>
<text x="264" y="134" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e8ebf2">берёт из этого</text>
<text x="264" y="152" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e8ebf2">коммита файлы</text>
<text x="264" y="172" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#6aa9ff">.github/workflows/</text>
<text x="264" y="202" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e8ebf2">каждая задача (job) —</text>
<text x="264" y="220" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e8ebf2">своя новая машина</text>
<text x="264" y="238" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e8ebf2">(раннер)</text>
<text x="264" y="268" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#9aa4b8">папки сборки там</text>
<text x="264" y="286" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#9aa4b8">нет — всё с нуля</text>

<line x1="428" y1="118" x2="448" y2="118" stroke="#9aa4b8" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M428,118 C438,118 438,72 452,72 L756,72 L756,80" fill="none" stroke="#9aa4b8" stroke-width="1.6" marker-end="url(#arr)"/>

<!-- Windows lane -->
<rect x="452" y="84" width="196" height="246" rx="10" fill="#262d3f" stroke="#343e57"/>
<text x="466" y="108" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13.5" fill="#e8ebf2" font-weight="bold">windows-2025</text>
<text x="466" y="126" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9aa4b8">GCC из MSYS2, UCRT64</text>
<g font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12.5" fill="#e8ebf2">
  <rect x="462" y="138" width="176" height="30" rx="6" fill="#1d2230"/>
  <text x="472" y="158">1  checkout</text>
  <rect x="462" y="174" width="176" height="30" rx="6" fill="#1d2230"/>
  <text x="472" y="194">2  MSYS2: gcc cmake ninja</text>
  <rect x="462" y="210" width="176" height="30" rx="6" fill="#1d2230"/>
  <text x="472" y="230">3  cmake — настройка</text>
  <rect x="462" y="246" width="176" height="30" rx="6" fill="#1d2230"/>
  <text x="472" y="266">4  cmake --build</text>
  <rect x="462" y="282" width="176" height="30" rx="6" fill="#1d2230"/>
  <text x="472" y="302">5  ctest</text>
</g>

<!-- Linux lane -->
<rect x="660" y="84" width="196" height="246" rx="10" fill="#262d3f" stroke="#343e57"/>
<text x="674" y="108" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13.5" fill="#e8ebf2" font-weight="bold">ubuntu-24.04</text>
<text x="674" y="126" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9aa4b8">библиотеки для raylib — apt</text>
<g font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12.5" fill="#e8ebf2">
  <rect x="670" y="138" width="176" height="30" rx="6" fill="#1d2230"/>
  <text x="680" y="158">1  checkout</text>
  <rect x="670" y="174" width="176" height="30" rx="6" fill="#1d2230"/>
  <text x="680" y="194">2  apt: X11, GL для окна</text>
  <rect x="670" y="210" width="176" height="30" rx="6" fill="#1d2230"/>
  <text x="680" y="230">3  cmake — настройка</text>
  <rect x="670" y="246" width="176" height="30" rx="6" fill="#1d2230"/>
  <text x="680" y="266">4  cmake --build</text>
  <rect x="670" y="282" width="176" height="30" rx="6" fill="#1d2230"/>
  <text x="680" y="302">5  ctest</text>
</g>

<!-- Правило шага -->
<rect x="24" y="352" width="832" height="64" rx="10" fill="#6aa9ff" fill-opacity="0.08" stroke="#6aa9ff" stroke-opacity="0.6"/>
<text x="40" y="378" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13.5" fill="#6aa9ff" font-weight="bold">Шаг — это команда.</text>
<text x="180" y="378" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13.5" fill="#e8ebf2">Код возврата 0 — шаг прошёл; не 0 — шаг упал, а следующие шаги этой задачи пропускаются.</text>
<text x="40" y="400" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#9aa4b8">ctest при красном тесте возвращает не 0 (в прогоне Claude — 8), поэтому красный тест сам делает CI красным.</text>

<!-- Итог -->
<rect x="24" y="432" width="408" height="70" rx="10" fill="#7bd389" fill-opacity="0.08" stroke="#7bd389" stroke-opacity="0.7"/>
<circle cx="52" cy="467" r="14" fill="#7bd389"/>
<path d="M45,467 l5,5 l9,-10" fill="none" stroke="#1d2230" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="76" y="460" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13.5" fill="#e8ebf2" font-weight="bold">Все задачи прошли</text>
<text x="76" y="480" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e8ebf2">галочка у коммита и в pull request</text>

<rect x="448" y="432" width="408" height="70" rx="10" fill="#ff6b6b" fill-opacity="0.08" stroke="#ff6b6b" stroke-opacity="0.7"/>
<circle cx="476" cy="467" r="14" fill="#ff6b6b"/>
<path d="M470,461 l12,12 M482,461 l-12,12" fill="none" stroke="#1d2230" stroke-width="3" stroke-linecap="round"/>
<text x="500" y="460" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13.5" fill="#e8ebf2" font-weight="bold">Хоть один шаг упал</text>
<text x="500" y="480" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e8ebf2">крест у коммита и лог упавшего шага</text>

<text x="24" y="530" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9aa4b8">fail-fast по умолчанию true: упала одна задача матрицы — остальные отменяются. С двумя машинами ставят fail-fast: false.</text>
<text x="24" y="548" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9aa4b8">На 25.10.2026 windows-latest = windows-2025, ubuntu-latest = ubuntu-24.04 (actions/runner-images). Урок C2, разделы 2.1 и 3.2.</text>
</svg>
