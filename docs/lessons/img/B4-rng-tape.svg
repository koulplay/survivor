<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Общий генератор</title><desc id="d">Оба мира берут числа с одной и той же ленты std::mt19937{42}; если картинка во втором мире взяла число, появление врага берёт следующее и получается другим.</desc><defs><marker id="me8ebf2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8ebf2"/></marker><marker id="mff6b6b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker></defs><rect x="0" y="0" width="880" height="300" rx="14" fill="#1d2230"/><text x="24" y="34" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#e8ebf2" font-weight="bold" text-anchor="start">Общий генератор: картинка сдвигает игру</text>
<text x="24" y="56" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#9aa4b8" font-weight="normal" text-anchor="start">std::mt19937{42} в обоих мирах — одна и та же лента чисел. Каждый вызов берёт следующее.</text>
<text x="30" y="124" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#4c9aff" font-weight="bold" text-anchor="start">мир A</text>
