<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Пуля и аура в одном тике</title><desc id="d">Medium с 1 HP: пуля доводит HP до −4, аура до −5. Если последствия срабатывают по условию HP ≤ 0, кристаллов два; если по переходу жив → мёртв, второй удар видит dead и пропускает — кристалл один.</desc><defs><marker id="m9aa4b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b8"/></marker></defs><rect x="0" y="0" width="880" height="400" rx="14" fill="#1d2230"/>
<text x="24" y="34" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#e8ebf2" font-weight="bold" text-anchor="start">Пуля и аура в одном тике</text>
<text x="24" y="56" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#9aa4b8" font-weight="normal" text-anchor="start">Medium с 1 HP. Сначала пуля (урон 5), потом импульс ауры (урон 1). Прогон Claude на копии кода игры.</text>
<text x="272.0" y="92" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#9aa4b8" font-weight="bold" text-anchor="middle">начало тика</text>
<text x="442.0" y="92" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#9aa4b8" font-weight="bold" text-anchor="middle">пуля</text>
<text x="612.0" y="92" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#9aa4b8" font-weight="bold" text-anchor="middle">аура</text>
<text x="782.0" y="92" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#9aa4b8" font-weight="bold" text-anchor="middle">итог тика</text>
<rect x="24" y="108" width="156" height="112" rx="8" fill="#1d2230" stroke="#ff6b6b" stroke-width="1.5"/>
<text x="36" y="158" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ff6b6b" font-weight="bold" text-anchor="start">последствия,</text>
<text x="36" y="178" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ff6b6b" font-weight="bold" text-anchor="start">когда HP ≤ 0</text>
<rect x="196" y="108" width="152" height="112" rx="8" fill="#262d3f" stroke="#3a435a" stroke-width="1"/>
<text x="272.0" y="136" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#e8ebf2" font-weight="bold" text-anchor="middle">жив</text>
<text x="272.0" y="158" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#9aa4b8" font-weight="normal" text-anchor="middle">HP 1</text>
<line x1="350" y1="164.0" x2="363" y2="164.0" stroke="#9aa4b8" stroke-width="1.6" marker-end="url(#m9aa4b8)"/>
<rect x="366" y="108" width="152" height="112" rx="8" fill="#262d3f" stroke="#3a435a" stroke-width="1"/>
<text x="442.0" y="136" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#e8ebf2" font-weight="bold" text-anchor="middle">HP −4</text>
<text x="442.0" y="158" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12.5" fill="#e8ebf2" font-weight="normal" text-anchor="middle">≤ 0:</text>
<text x="442.0" y="178" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12.5" fill="#e8ebf2" font-weight="normal" text-anchor="middle">кристалл №1</text>
<text x="442.0" y="198" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#9aa4b8" font-weight="normal" text-anchor="middle">dead = true</text>
<line x1="520" y1="164.0" x2="533" y2="164.0" stroke="#9aa4b8" stroke-width="1.6" marker-end="url(#m9aa4b8)"/>
<rect x="536" y="108" width="152" height="112" rx="8" fill="#262d3f" stroke="#ff6b6b" stroke-width="1.5"/>
<text x="612.0" y="136" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#e8ebf2" font-weight="bold" text-anchor="middle">HP −5</text>
<text x="612.0" y="158" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12.5" fill="#ff6b6b" font-weight="normal" text-anchor="middle">снова ≤ 0:</text>
<text x="612.0" y="178" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12.5" fill="#ff6b6b" font-weight="bold" text-anchor="middle">кристалл №2</text>
<line x1="690" y1="164.0" x2="703" y2="164.0" stroke="#9aa4b8" stroke-width="1.6" marker-end="url(#m9aa4b8)"/>
<rect x="706" y="108" width="152" height="112" rx="8" fill="#262d3f" stroke="#ff6b6b" stroke-width="1.5"/>
<text x="782.0" y="136" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#ff6b6b" font-weight="bold" text-anchor="middle">2 кристалла</text>
<text x="782.0" y="158" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12.5" fill="#9aa4b8" font-weight="normal" text-anchor="middle">от одного врага</text>
<rect x="24" y="236" width="156" height="112" rx="8" fill="#1d2230" stroke="#7bd389" stroke-width="1.5"/>
<text x="36" y="286" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7bd389" font-weight="bold" text-anchor="start">последствия,</text>
<text x="36" y="306" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7bd389" font-weight="bold" text-anchor="start">когда жив → мёртв</text>
<rect x="196" y="236" width="152" height="112" rx="8" fill="#262d3f" stroke="#3a435a" stroke-width="1"/>
<text x="272.0" y="264" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#e8ebf2" font-weight="bold" text-anchor="middle">жив</text>
<text x="272.0" y="286" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#9aa4b8" font-weight="normal" text-anchor="middle">HP 1</text>
<line x1="350" y1="292.0" x2="363" y2="292.0" stroke="#9aa4b8" stroke-width="1.6" marker-end="url(#m9aa4b8)"/>
<rect x="366" y="236" width="152" height="112" rx="8" fill="#262d3f" stroke="#3a435a" stroke-width="1"/>
<text x="442.0" y="264" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#e8ebf2" font-weight="bold" text-anchor="middle">HP −4</text>
<text x="442.0" y="286" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12.5" fill="#e8ebf2" font-weight="normal" text-anchor="middle">переход:</text>
<text x="442.0" y="306" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12.5" fill="#e8ebf2" font-weight="normal" text-anchor="middle">кристалл №1</text>
<text x="442.0" y="326" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#9aa4b8" font-weight="normal" text-anchor="middle">dead = true</text>
<line x1="520" y1="292.0" x2="533" y2="292.0" stroke="#9aa4b8" stroke-width="1.6" marker-end="url(#m9aa4b8)"/>
<rect x="536" y="236" width="152" height="112" rx="8" fill="#262d3f" stroke="#7bd389" stroke-width="1.5"/>
<text x="612.0" y="264" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#e8ebf2" font-weight="bold" text-anchor="middle">уже dead</text>
<text x="612.0" y="286" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12.5" fill="#9aa4b8" font-weight="normal" text-anchor="middle">перехода нет:</text>
<text x="612.0" y="306" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12.5" fill="#7bd389" font-weight="bold" text-anchor="middle">пропуск</text>
<line x1="690" y1="292.0" x2="703" y2="292.0" stroke="#9aa4b8" stroke-width="1.6" marker-end="url(#m9aa4b8)"/>
<rect x="706" y="236" width="152" height="112" rx="8" fill="#262d3f" stroke="#7bd389" stroke-width="1.5"/>
<text x="782.0" y="264" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#7bd389" font-weight="bold" text-anchor="middle">1 кристалл</text>
<text x="782.0" y="286" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12.5" fill="#9aa4b8" font-weight="normal" text-anchor="middle">как и должно</text>
<text x="24" y="384" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e8ebf2" font-weight="normal" text-anchor="start">«HP ≤ 0» — состояние: оно истинно при каждом следующем ударе. «Жив → мёртв» — событие: бывает один раз.</text></svg>
