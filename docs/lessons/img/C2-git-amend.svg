<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Переписанный отправленный коммит</title>
<desc id="d">Слева: после git push на GitHub лежит коммит ab0ab37 «Update study files». После git commit --amend у тебя вместо него новый коммит a3dad41 с тем же названием. Ветки разошлись, git push отклонён: non-fast-forward. Справа: git pull --no-rebase сливает оба коммита в коммит слияния 5fdee0a — в истории два коммита с одним названием. Так было в репозитории survivor 23.10.2026.</desc>
<rect x="0" y="0" width="880" height="320" rx="14" fill="#1d2230"/>
<g font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif">
<text x="24" y="34" font-size="18" fill="#e8ebf2" font-weight="bold">--amend после push: два коммита с одним названием</text>
<text x="24" y="56" font-size="13" fill="#9aa4b8">Хэши — из прогона Г9. --amend не правит коммит, а делает новый.</text>
<line x1="450" y1="76" x2="450" y2="296" stroke="#9aa4b8" stroke-opacity="0.35"/>
<text x="24" y="90" font-size="14.5" fill="#e8ebf2" font-weight="bold">После --amend</text>
<text x="474" y="90" font-size="14.5" fill="#e8ebf2" font-weight="bold">После git pull --no-rebase</text>
</g>

<!-- left -->
<g fill="none" stroke-width="3">
  <path d="M70,185 L190,135" stroke="#c9a7ff"/>
  <path d="M70,185 L190,235" stroke="#6aa9ff"/>
</g>
<g stroke-width="3">
  <circle cx="70" cy="185" r="10" fill="#1d2230" stroke="#9aa4b8"/>
  <circle cx="190" cy="135" r="10" fill="#1d2230" stroke="#c9a7ff"/>
  <circle cx="190" cy="235" r="10" fill="#6aa9ff" stroke="#6aa9ff"/>
</g>
<g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#9aa4b8">
  <text x="70" y="214" text-anchor="middle">ebce493</text>
  <text x="206" y="131">ab0ab37</text>
  <text x="206" y="240">a3dad41</text>
</g>
<g font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12">
  <text x="206" y="113" fill="#c9a7ff" font-weight="bold">на GitHub (origin/master)</text>
  <text x="206" y="148" fill="#e8ebf2">«Update study files»</text>
  <text x="206" y="222" fill="#6aa9ff" font-weight="bold">у тебя (master)</text>
  <text x="206" y="257" fill="#e8ebf2">«Update study files» + NOTES.md</text>
</g>
<rect x="24" y="270" width="404" height="34" rx="8" fill="#ff6b6b" fill-opacity="0.1" stroke="#ff6b6b" stroke-opacity="0.8"/>
<text x="38" y="292" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#ff6b6b">git push → ! [rejected] (non-fast-forward)</text>

<!-- right -->
<g fill="none" stroke-width="3">
  <path d="M510,185 L630,135" stroke="#c9a7ff"/>
  <path d="M510,185 L630,235" stroke="#6aa9ff"/>
  <path d="M630,135 L760,185" stroke="#c9a7ff"/>
  <path d="M630,235 L760,185" stroke="#6aa9ff"/>
</g>
