  <circle cx="510" cy="185" r="10" fill="#1d2230" stroke="#9aa4b8"/>
  <circle cx="630" cy="135" r="10" fill="#1d2230" stroke="#c9a7ff"/>
  <circle cx="630" cy="235" r="10" fill="#1d2230" stroke="#6aa9ff"/>
  <circle cx="760" cy="185" r="12" fill="#6aa9ff" stroke="#6aa9ff"/>
</g>
<g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#9aa4b8">
