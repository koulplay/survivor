<svg xmlns="http://www.w3.org/2000/svg" width="920" height="340" viewBox="0 0 920 340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Слепое пятно хэша</title><desc id="d">shot_timer во втором мире больше на 1,0 с с первого тика; набор полей без него видит разницу лишь в 12 коротких окнах, 41 тик; проверки каждые 60 тиков ни разу не попадают в них.</desc><defs></defs><rect x="0" y="0" width="920" height="340" rx="14" fill="#1d2230"/><text x="24" y="34" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#e8ebf2" font-weight="bold" text-anchor="start">Слепое пятно: shot_timer не в хэше</text>
