<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Как тест прогоняет игру</title><desc id="d">Сценарий по номеру тика выдаёт Input; оба мира World(42) получают одинаковый ввод и идут 3600 тиков; каждые 60 тиков хэши сравниваются.</desc><defs><marker id="m2ec4b6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2ec4b6"/></marker><marker id="m4c9aff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4c9aff"/></marker><marker id="mffd166" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs><rect x="0" y="0" width="880" height="440" rx="14" fill="#1d2230"/><text x="24" y="34" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#e8ebf2" font-weight="bold" text-anchor="start">Как тест прогоняет игру</text>
<text x="24" y="56" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#9aa4b8" font-weight="normal" text-anchor="start">Окна, клавиатуры и часов нет: тик — это просто вызов в цикле.</text>
<rect x="330" y="76" width="220" height="62" rx="8" fill="#262d3f" stroke="#ffd166" stroke-width="2"/>
<text x="440" y="102" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#e8ebf2" font-weight="bold" text-anchor="middle">Сценарий(tick)</text>
<text x="440" y="124" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9aa4b8" font-weight="normal" text-anchor="middle">номер тика → Input</text>
<rect x="60" y="176" width="300" height="156" rx="8" fill="#262d3f" stroke="#4c9aff" stroke-width="2"/>
<text x="210" y="202" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#4c9aff" font-weight="bold" text-anchor="middle">Мир A — World(42)</text>
<text x="82" y="232" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e8ebf2" font-weight="normal" text-anchor="start">для tick = 1 … 3600:</text>
<text x="100" y="256" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#9aa4b8" font-weight="normal" text-anchor="start">Playing  → Update</text>
<text x="100" y="278" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#9aa4b8" font-weight="normal" text-anchor="start">LevelUp  → меню</text>
<text x="100" y="300" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#9aa4b8" font-weight="normal" text-anchor="start">GameOver → ничего</text>
<text x="210" y="324" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9aa4b8" font-weight="normal" text-anchor="middle" font-style="italic">как в main</text>
<rect x="520" y="176" width="300" height="156" rx="8" fill="#262d3f" stroke="#2ec4b6" stroke-width="2"/>
<text x="670" y="202" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2ec4b6" font-weight="bold" text-anchor="middle">Мир B — World(42)</text>
<text x="542" y="232" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e8ebf2" font-weight="normal" text-anchor="start">для tick = 1 … 3600:</text>
<text x="560" y="256" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#9aa4b8" font-weight="normal" text-anchor="start">Playing  → Update</text>
<text x="560" y="278" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#9aa4b8" font-weight="normal" text-anchor="start">LevelUp  → меню</text>
<text x="560" y="300" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#9aa4b8" font-weight="normal" text-anchor="start">GameOver → ничего</text>
<text x="670" y="324" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9aa4b8" font-weight="normal" text-anchor="middle" font-style="italic">как в main</text>
<line x1="410" y1="138" x2="230" y2="172" stroke="#ffd166" stroke-width="1.8" marker-end="url(#mffd166)"/>
<line x1="470" y1="138" x2="650" y2="172" stroke="#ffd166" stroke-width="1.8" marker-end="url(#mffd166)"/>
<text x="440" y="160" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffd166" font-weight="normal" text-anchor="middle">тот же Input</text>
<rect x="300" y="362" width="280" height="56" rx="8" fill="#262d3f" stroke="#e8ebf2" stroke-width="1.5"/>
<text x="440" y="386" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#9aa4b8" font-weight="normal" text-anchor="middle">каждые 60 тиков:</text>
<text x="440" y="406" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#e8ebf2" font-weight="bold" text-anchor="middle">Hash(A) == Hash(B) ?</text>
<line x1="210" y1="332" x2="330" y2="360" stroke="#4c9aff" stroke-width="1.8" marker-end="url(#m4c9aff)"/>
<line x1="670" y1="332" x2="550" y2="360" stroke="#2ec4b6" stroke-width="1.8" marker-end="url(#m2ec4b6)"/>
<text x="60" y="396" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7bd389" font-weight="bold" text-anchor="start">да → дальше</text>
<text x="600" y="388" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ff6b6b" font-weight="bold" text-anchor="start">нет → тест красный:</text>
<text x="600" y="408" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ff6b6b" font-weight="normal" text-anchor="start">«разошлись на тике 1200»</text></svg>
