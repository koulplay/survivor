<svg xmlns="http://www.w3.org/2000/svg" width="880" height="600" viewBox="0 0 880 600" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Модель сборки: кто какую ошибку ловит</title>
<desc id="d">Пять исходников игры, в каждый вставлен world.h. Компилятор переводит каждую единицу трансляции в объектный файл со своими символами: world.cpp.o определяет GetEnemyDef (T), остальные его используют (U); конструктор Enemy — слабый символ (W); у каждого файла своя копия kEnemyDefs (r). Компоновщик собирает survivor и tests: каждой U — одна T, из слабых — одна копия. Внизу — кто какие ошибки ловит: компилятор, компоновщик или никто.</desc>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9aa4b8"/>
  </marker>
</defs>
<rect x="0" y="0" width="880" height="600" rx="14" fill="#1d2230"/>
<text x="24" y="34" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#e8ebf2" font-weight="bold">Модель сборки: кто какую ошибку ловит</text>
<text x="24" y="56" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#9aa4b8">Компилятор видит одну единицу трансляции; компоновщик — все объектные файлы, но только имена символов.</text>

<!-- column headers -->
<text x="24" y="86" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e8ebf2" font-weight="bold">Исходник + заголовки</text>
<text x="236" y="86" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e8ebf2" font-weight="bold">Компилятор: по одной единице трансляции → .o</text>
<text x="652" y="86" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e8ebf2" font-weight="bold">Компоновщик</text>

<!-- group labels -->
<g font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="11.5" fill="#9aa4b8">
  <text x="236" y="104">библиотека survivor_core</text>
  <text x="236" y="218">игра survivor</text>
  <text x="236" y="332">тесты</text>
</g>

<!-- sources -->
