<!-- who catches what -->
<text x="24" y="428" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#e8ebf2" font-weight="bold">Кто какую ошибку ловит</text>
<rect x="24" y="438" width="832" height="40" rx="8" fill="#262d3f"/>
<text x="38" y="463" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6aa9ff" font-weight="bold">Компилятор</text>
<text x="170" y="463" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e8ebf2">видит одну единицу трансляции: синтаксис, типы, «not declared» (NOTES №22)</text>

<rect x="24" y="484" width="832" height="40" rx="8" fill="#262d3f"/>
<text x="38" y="509" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffd166" font-weight="bold">Компоновщик</text>
<text x="170" y="509" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e8ebf2">undefined reference — U без T (NOTES №12); multiple definition — две T на одно имя</text>

<rect x="24" y="530" width="832" height="40" rx="8" fill="#262d3f"/>
<text x="38" y="555" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ff6b6b" font-weight="bold">Никто</text>
<text x="170" y="555" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e8ebf2">нарушение ODR — разные определения одного имени; заголовок, пришедший транзитивно</text>

<text x="24" y="590" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9aa4b8">nm, сборка Debug, GCC 13.3, Linux — прогон Claude 25.10.2026. T — определён здесь, U — нужен извне, W — слабый, r — данные.</text>
</svg>
