  <rect x="236" y="110" width="384" height="40" rx="8" fill="#262d3f" stroke="#343e57"/>
  <rect x="236" y="156" width="384" height="40" rx="8" fill="#262d3f" stroke="#343e57"/>
  <rect x="236" y="224" width="384" height="40" rx="8" fill="#262d3f" stroke="#343e57"/>
