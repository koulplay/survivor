  <rect x="24" y="224" width="176" height="40" rx="8" fill="#262d3f" stroke="#343e57"/>
  <text x="36" y="249">main.cpp</text>
  <rect x="24" y="270" width="176" height="40" rx="8" fill="#262d3f" stroke="#343e57"/>
  <text x="36" y="295">draw.cpp</text>
  <rect x="24" y="338" width="176" height="40" rx="8" fill="#262d3f" stroke="#343e57"/>
  <text x="36" y="363">tests.cpp</text>
</g>
