  <text x="248" y="135" fill="#e8ebf2" font-weight="bold">world.cpp.o</text>
  <text x="352" y="135" font-size="12"><tspan fill="#7bd389" font-weight="bold">T</tspan><tspan fill="#e8ebf2"> GetEnemyDef</tspan><tspan fill="#e8ebf2">  </tspan><tspan fill="#9aa4b8" font-weight="bold">r</tspan><tspan fill="#e8ebf2"> kEnemyDefs</tspan></text>
  <text x="248" y="181" fill="#e8ebf2" font-weight="bold">update.cpp.o</text>
  <text x="352" y="181" font-size="12"><tspan fill="#ffd166" font-weight="bold">U</tspan><tspan fill="#e8ebf2"> GetEnemyDef</tspan><tspan fill="#e8ebf2">  </tspan><tspan fill="#6aa9ff" font-weight="bold">W</tspan><tspan fill="#e8ebf2"> Enemy</tspan><tspan fill="#e8ebf2">  </tspan><tspan fill="#9aa4b8" font-weight="bold">r</tspan><tspan fill="#e8ebf2"> kEnemyDefs</tspan></text>
  <text x="248" y="249" fill="#e8ebf2" font-weight="bold">main.cpp.o</text>
  <text x="352" y="249" font-size="12"><tspan fill="#9aa4b8" font-weight="bold">r</tspan><tspan fill="#e8ebf2"> kEnemyDefs</tspan></text>
  <text x="248" y="295" fill="#e8ebf2" font-weight="bold">draw.cpp.o</text>
  <text x="352" y="295" font-size="12"><tspan fill="#ffd166" font-weight="bold">U</tspan><tspan fill="#e8ebf2"> GetEnemyDef</tspan><tspan fill="#e8ebf2">  </tspan><tspan fill="#9aa4b8" font-weight="bold">r</tspan><tspan fill="#e8ebf2"> kEnemyDefs</tspan></text>
  <text x="248" y="363" fill="#e8ebf2" font-weight="bold">tests.cpp.o</text>
  <text x="352" y="363" font-size="12"><tspan fill="#ffd166" font-weight="bold">U</tspan><tspan fill="#e8ebf2"> GetEnemyDef</tspan><tspan fill="#e8ebf2">  </tspan><tspan fill="#6aa9ff" font-weight="bold">W</tspan><tspan fill="#e8ebf2"> Enemy</tspan><tspan fill="#e8ebf2">  </tspan><tspan fill="#9aa4b8" font-weight="bold">r</tspan><tspan fill="#e8ebf2"> kEnemyDefs</tspan></text>
</g>

<!-- linker column -->
<rect x="660" y="110" width="196" height="86" rx="8" fill="#6aa9ff" fill-opacity="0.08" stroke="#6aa9ff" stroke-opacity="0.6"/>
<g font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12.5" fill="#e8ebf2">
  <text x="672" y="131">каждой <tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#ffd166" font-weight="bold">U</tspan> — ровно одна <tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#7bd389" font-weight="bold">T</tspan></text>
  <text x="672" y="151">из <tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#6aa9ff" font-weight="bold">W</tspan> оставляет одну копию</text>
  <text x="672" y="171"><tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#9aa4b8" font-weight="bold">r</tspan> — у каждого файла своя:</text>
  <text x="672" y="189">kEnemyDefs × 4 в survivor</text>
</g>

<rect x="660" y="216" width="196" height="88" rx="8" fill="#262d3f" stroke="#7bd389" stroke-opacity="0.8"/>
<text x="672" y="238" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13.5" fill="#7bd389" font-weight="bold">survivor</text>
