<text x="40" y="226" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e8ebf2" font-weight="normal" text-anchor="start">Два врага с одинаковыми полями могут различаться байтами «?».</text>
<text x="40" y="248" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e8ebf2" font-weight="normal" text-anchor="start">Хэш куска памяти (или memcmp) скажет «разные» — тест покраснеет на ровном месте, и не каждый раз.</text>
<text x="40" y="276" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffd166" font-weight="bold" text-anchor="start">Поэтому хэшируют поле за полем.</text></svg>
