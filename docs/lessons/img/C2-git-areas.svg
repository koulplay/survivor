<svg xmlns="http://www.w3.org/2000/svg" width="880" height="384" viewBox="0 0 880 384" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Где живут изменения</title>
<desc id="d">Четыре места: рабочая папка, индекс, локальная история, GitHub. Вперёд изменения идут командами git add, git commit, git push. Назад: git restore возвращает файл из индекса, git restore --staged возвращает индекс из последнего коммита, git fetch приносит коммиты с GitHub в локальную историю как origin/master, git pull — это fetch плюс слияние в текущую ветку и файлы.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8ebf2"/></marker>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b8"/></marker>
</defs>
<rect x="0" y="0" width="880" height="384" rx="14" fill="#1d2230"/>
<g font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif">
<text x="24" y="34" font-size="18" fill="#e8ebf2" font-weight="bold">Где живут изменения</text>
<text x="24" y="56" font-size="13" fill="#9aa4b8">Вперёд — сверху, назад — снизу. Коммит берёт то, что лежит в индексе, а не файлы на диске.</text>

<!-- boxes -->
<rect x="24" y="118" width="190" height="92" rx="10" fill="#9aa4b8" fill-opacity="0.08" stroke="#9aa4b8" stroke-width="2"/>
<text x="119" y="146" font-size="15" fill="#e8ebf2" font-weight="bold" text-anchor="middle">Рабочая папка</text>
<text x="119" y="168" font-size="12.5" fill="#9aa4b8" text-anchor="middle">файлы на диске,</text>
<text x="119" y="186" font-size="12.5" fill="#9aa4b8" text-anchor="middle">правишь в редакторе</text>

<rect x="238" y="118" width="190" height="92" rx="10" fill="#ffb86b" fill-opacity="0.08" stroke="#ffb86b" stroke-width="2"/>
<text x="333" y="146" font-size="15" fill="#ffb86b" font-weight="bold" text-anchor="middle">Индекс</text>
<text x="333" y="168" font-size="12.5" fill="#9aa4b8" text-anchor="middle">черновик коммита:</text>
<text x="333" y="186" font-size="12.5" fill="#9aa4b8" text-anchor="middle">что в него войдёт</text>

<rect x="452" y="118" width="190" height="92" rx="10" fill="#6aa9ff" fill-opacity="0.08" stroke="#6aa9ff" stroke-width="2"/>
<text x="547" y="146" font-size="15" fill="#6aa9ff" font-weight="bold" text-anchor="middle">Локальная история</text>
<text x="547" y="168" font-size="12.5" fill="#9aa4b8" text-anchor="middle">коммиты в .git</text>
<text x="547" y="186" font-size="12.5" fill="#9aa4b8" text-anchor="middle">у тебя на диске</text>

<rect x="666" y="118" width="190" height="92" rx="10" fill="#c9a7ff" fill-opacity="0.08" stroke="#c9a7ff" stroke-width="2"/>
<text x="761" y="146" font-size="15" fill="#c9a7ff" font-weight="bold" text-anchor="middle">GitHub (origin)</text>
<text x="761" y="168" font-size="12.5" fill="#9aa4b8" text-anchor="middle">копия истории</text>
<text x="761" y="186" font-size="12.5" fill="#9aa4b8" text-anchor="middle">на сервере</text>
</g>

<!-- forward arcs -->
<g fill="none" stroke="#e8ebf2" stroke-width="2" marker-end="url(#a)">
  <path d="M129,116 C129,74 323,74 323,112"/>
  <path d="M343,116 C343,74 537,74 537,112"/>
  <path d="M557,116 C557,74 751,74 751,112"/>
</g>
<g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13.5" fill="#e8ebf2" text-anchor="middle" font-weight="bold">
  <text x="226" y="80">git add</text>
  <text x="440" y="80">git commit</text>
  <text x="654" y="80">git push</text>
</g>

<!-- backward arcs -->
<g fill="none" stroke="#9aa4b8" stroke-width="2" marker-end="url(#ab)">
  <path d="M323,212 C323,252 129,252 129,216"/>
  <path d="M537,212 C537,252 343,252 343,216"/>
  <path d="M751,212 C751,252 557,252 557,216"/>
  <path d="M846,212 L846,298 Q846,306 838,306 L42,306 Q34,306 34,298 L34,216" stroke-dasharray="6 5"/>
</g>
<g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#9aa4b8" text-anchor="middle">
  <text x="226" y="266">git restore</text>
  <text x="440" y="266">git restore --staged</text>
  <text x="654" y="266">git fetch</text>
  <text x="440" y="328">git pull = git fetch + слияние в текущую ветку</text>
</g>
<g font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="11.5" fill="#9aa4b8" text-anchor="middle">
  <text x="226" y="282">файл — из индекса</text>
  <text x="440" y="282">индекс — из последнего коммита</text>
  <text x="654" y="282">только ярлык origin/master</text>
</g>
<text x="24" y="368" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9aa4b8">git diff — папка против индекса; git diff --staged — индекс против последнего коммита. Урок C2 (git), 2.1 и Г2–Г3.</text>
</svg>
