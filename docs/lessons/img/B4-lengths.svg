<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Длина перед списком</title><desc id="d">Без длин списки ["ab","c"] и ["a","bc"] дают одинаковый поток байтов; с длинами — разные.</desc><defs></defs><rect x="0" y="0" width="880" height="300" rx="14" fill="#1d2230"/><text x="24" y="34" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#e8ebf2" font-weight="bold" text-anchor="start">Без длины границы списков теряются</text>
<text x="24" y="56" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#9aa4b8" font-weight="normal" text-anchor="start">["ab", "c"] против ["a", "bc"] — хэш видит только поток байтов</text>
<text x="30" y="112" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#e8ebf2" font-weight="bold" text-anchor="start">без длин</text>
