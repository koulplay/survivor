<text x="30" y="262" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e8ebf2" font-weight="normal" text-anchor="start">Жёлтое — длина перед частью переменной длины. У нас: число врагов перед врагами, число пуль перед пулями…</text></svg>
