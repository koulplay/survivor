<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Вектору не хватило места: копия или перемещение</title><desc id="d">При третьем emplace_back вектор ёмкостью 2 выделяет буфер на 4 и переносит элементы 1 и 2: без noexcept у перемещения — копиями, с noexcept — перемещением.</desc><defs><marker id="m2ec4b6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2ec4b6"/></marker><marker id="m4c9aff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4c9aff"/></marker></defs><rect x="0" y="0" width="880" height="450" rx="14" fill="#1d2230"/><text x="24" y="34" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#e8ebf2" font-weight="bold" text-anchor="start">Вектору не хватило места: копия или перемещение</text>
<text x="24" y="56" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#9aa4b8" font-weight="normal" text-anchor="start">Третий emplace_back из realloc.cpp: ёмкость 2 → 4 (libstdc++). Вывод — прогон Claude, GCC 16.2.</text>
<rect x="24" y="74" width="832" height="160" rx="10" fill="#262d3f" stroke="#4c9aff" stroke-width="1.5"/>
<text x="40" y="98" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#4c9aff" font-weight="bold" text-anchor="start">Noisy(Noisy&amp;&amp;) без noexcept — вектор КОПИРУЕТ</text>
<text x="40" y="124" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#9aa4b8" font-weight="normal" text-anchor="start">старый буфер, ёмкость 2</text>
<rect x="40" y="132" width="56" height="36" rx="3" fill="#2f384d" stroke="#5a6680" stroke-width="1.2"/>
<text x="68" y="155" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e8ebf2" font-weight="normal" text-anchor="middle">1</text>
<rect x="96" y="132" width="56" height="36" rx="3" fill="#2f384d" stroke="#5a6680" stroke-width="1.2"/>
<text x="124" y="155" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e8ebf2" font-weight="normal" text-anchor="middle">2</text>
<text x="330" y="124" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#9aa4b8" font-weight="normal" text-anchor="start">новый буфер, ёмкость 4</text>
<rect x="330" y="132" width="56" height="36" rx="3" fill="#2f384d" stroke="#4c9aff" stroke-width="1.2"/>
<text x="358" y="155" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e8ebf2" font-weight="normal" text-anchor="middle">1</text>
<rect x="386" y="132" width="56" height="36" rx="3" fill="#2f384d" stroke="#4c9aff" stroke-width="1.2"/>
<text x="414" y="155" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e8ebf2" font-weight="normal" text-anchor="middle">2</text>
<rect x="442" y="132" width="56" height="36" rx="3" fill="#2f384d" stroke="#ffd166" stroke-width="1.2"/>
<text x="470" y="155" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#ffd166" font-weight="normal" text-anchor="middle">3</text>
<rect x="498" y="132" width="56" height="36" rx="3" fill="#1d2230" stroke="#5a6680" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="470" y="186" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="10.5" fill="#ffd166" font-weight="normal" text-anchor="middle">строится</text>
<text x="470" y="199" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="10.5" fill="#ffd166" font-weight="normal" text-anchor="middle">на месте</text>
<path d="M 68 168 C 68 202, 358 202, 358 172" fill="none" stroke="#4c9aff" stroke-width="1.6" marker-end="url(#m4c9aff)"/>
<path d="M 124 168 C 124 202, 414 202, 414 172" fill="none" stroke="#4c9aff" stroke-width="1.6" marker-end="url(#m4c9aff)"/>
<text x="213" y="208" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#4c9aff" font-weight="bold" text-anchor="middle">copy 1, copy 2</text>
<rect x="560" y="114" width="280" height="62" rx="6" fill="#1d2230" stroke="#5a6680" stroke-width="1.2"/>
<text x="570" y="134" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#e8ebf2" font-weight="normal" text-anchor="start">emplace_back(3), capacity before: 2</text>
<text x="570" y="151" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#e8ebf2" font-weight="normal" text-anchor="start">  copy 1</text>
<text x="570" y="168" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#e8ebf2" font-weight="normal" text-anchor="start">  copy 2</text>
<text x="40" y="226" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e8ebf2" font-weight="normal" text-anchor="start">Копия бросила — новый буфер выбрасывают, старый цел: вектор как был (строгая гарантия).</text>
<text x="560" y="196" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="11.5" fill="#9aa4b8" font-weight="normal" text-anchor="start">старые элементы целы до конца</text>
<rect x="24" y="250" width="832" height="160" rx="10" fill="#262d3f" stroke="#2ec4b6" stroke-width="1.5"/>
<text x="40" y="274" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2ec4b6" font-weight="bold" text-anchor="start">Noisy(Noisy&amp;&amp;) noexcept — вектор ПЕРЕМЕЩАЕТ</text>
<text x="40" y="300" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#9aa4b8" font-weight="normal" text-anchor="start">старый буфер, ёмкость 2</text>
<rect x="40" y="308" width="56" height="36" rx="3" fill="#2f384d" stroke="#5a6680" stroke-width="1.2"/>
<text x="68" y="331" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e8ebf2" font-weight="normal" text-anchor="middle">1</text>
<rect x="96" y="308" width="56" height="36" rx="3" fill="#2f384d" stroke="#5a6680" stroke-width="1.2"/>
<text x="124" y="331" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e8ebf2" font-weight="normal" text-anchor="middle">2</text>
<text x="330" y="300" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#9aa4b8" font-weight="normal" text-anchor="start">новый буфер, ёмкость 4</text>
<rect x="330" y="308" width="56" height="36" rx="3" fill="#2f384d" stroke="#2ec4b6" stroke-width="1.2"/>
<text x="358" y="331" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e8ebf2" font-weight="normal" text-anchor="middle">1</text>
<rect x="386" y="308" width="56" height="36" rx="3" fill="#2f384d" stroke="#2ec4b6" stroke-width="1.2"/>
<text x="414" y="331" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e8ebf2" font-weight="normal" text-anchor="middle">2</text>
<rect x="442" y="308" width="56" height="36" rx="3" fill="#2f384d" stroke="#ffd166" stroke-width="1.2"/>
<text x="470" y="331" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#ffd166" font-weight="normal" text-anchor="middle">3</text>
<rect x="498" y="308" width="56" height="36" rx="3" fill="#1d2230" stroke="#5a6680" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="470" y="362" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="10.5" fill="#ffd166" font-weight="normal" text-anchor="middle">строится</text>
<text x="470" y="375" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="10.5" fill="#ffd166" font-weight="normal" text-anchor="middle">на месте</text>
<path d="M 68 344 C 68 378, 358 378, 358 348" fill="none" stroke="#2ec4b6" stroke-width="1.6" marker-end="url(#m2ec4b6)"/>
<path d="M 124 344 C 124 378, 414 378, 414 348" fill="none" stroke="#2ec4b6" stroke-width="1.6" marker-end="url(#m2ec4b6)"/>
<text x="213" y="384" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#2ec4b6" font-weight="bold" text-anchor="middle">move 1, move 2</text>
<rect x="560" y="290" width="280" height="62" rx="6" fill="#1d2230" stroke="#5a6680" stroke-width="1.2"/>
<text x="570" y="310" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#e8ebf2" font-weight="normal" text-anchor="start">emplace_back(3), capacity before: 2</text>
<text x="570" y="327" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#e8ebf2" font-weight="normal" text-anchor="start">  move 1</text>
<text x="570" y="344" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#e8ebf2" font-weight="normal" text-anchor="start">  move 2</text>
<text x="40" y="402" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e8ebf2" font-weight="normal" text-anchor="start">Перемещение обещает не бросать — откатывать не придётся. Копий нет.</text>
<text x="560" y="372" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="11.5" fill="#9aa4b8" font-weight="normal" text-anchor="start">старые элементы — пустые, но целые</text>
<text x="24" y="438" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12.5" fill="#9aa4b8" font-weight="normal" text-anchor="start">Если копировать нельзя (= delete), вектор перемещает и без noexcept — но гарантию теряет.</text></svg>
