<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Один клинок проходит мимо врага: 8–9 тиков касания</title><desc id="d">Клинок на орбите 60 пикселей делает оборот за 1,5 секунды и смещается на 4,19 пикселя за тик; неподвижный враг радиусом 10 на орбите касается клинка радиусом 8, пока центры ближе 18 пикселей: 8 или 9 тиков подряд.</desc><defs><marker id="mffd166" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs><rect x="0" y="0" width="880" height="470" rx="14" fill="#1d2230"/><text x="24" y="34" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#e8ebf2" font-weight="bold" text-anchor="start">Один клинок проходит мимо врага: 8–9 тиков касания</text>
<text x="24" y="56" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#9aa4b8" font-weight="normal" text-anchor="start">Масштаб ×3. Орбита 60, клинок 8, Medium 10, оборот за 1,5 с: шаг клинка 4° = 4,19 пикс за тик.</text>
<rect x="252.0" y="362.0" width="96.0" height="96.0" rx="2" fill="#3a4258" stroke="#e8ebf2" stroke-width="1.2"/>
<text x="300" y="415" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e8ebf2" font-weight="normal" text-anchor="middle">игрок</text>
<path d="M 141.1 325.5 A 180.0 180.0 0 0 1 458.9 325.5" fill="none" stroke="#5a6680" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="466.93056671460687" y="329.49511869853967" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9aa4b8" font-weight="normal" text-anchor="start">орбита клинка, 60</text>
<circle cx="300.0" cy="230.0" r="54.0" fill="none" stroke="#ff7a6b" stroke-width="1.3" stroke-dasharray="5 4"/>
<circle cx="300.0" cy="230.0" r="30.0" fill="#5a2a2a" stroke="#ff7a6b" stroke-width="1.6"/>
<text x="300" y="278.0" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e8ebf2" font-weight="bold" text-anchor="middle">Medium</text>
<circle cx="215.5" cy="251.1" r="4.2" fill="#5a6680"/>
<circle cx="226.8" cy="245.6" r="4.2" fill="#5a6680"/>
<circle cx="238.4" cy="240.9" r="4.2" fill="#5a6680"/>
<circle cx="250.4" cy="237.0" r="4.2" fill="#ffd166"/>
<circle cx="262.6" cy="233.9" r="4.2" fill="#ffd166"/>
<circle cx="274.9" cy="231.8" r="4.2" fill="#ffd166"/>
<circle cx="287.4" cy="230.4" r="4.2" fill="#ffd166"/>
<circle cx="300.0" cy="230.0" r="4.2" fill="#ffd166"/>
<circle cx="312.6" cy="230.4" r="4.2" fill="#ffd166"/>
<circle cx="325.1" cy="231.8" r="4.2" fill="#ffd166"/>
<circle cx="337.4" cy="233.9" r="4.2" fill="#ffd166"/>
<circle cx="349.6" cy="237.0" r="4.2" fill="#ffd166"/>
<circle cx="361.6" cy="240.9" r="4.2" fill="#5a6680"/>
<circle cx="373.2" cy="245.6" r="4.2" fill="#5a6680"/>
<circle cx="384.5" cy="251.1" r="4.2" fill="#5a6680"/>
<circle cx="250.4" cy="237.0" r="24.0" fill="none" stroke="#ffd166" stroke-width="1.4"/>
<circle cx="349.6" cy="237.0" r="24.0" fill="none" stroke="#ffd166" stroke-width="1.4"/>
<text x="300" y="134.0" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffd166" font-weight="bold" text-anchor="middle">касание: 9 тиков подряд (при другой фазе — 8)</text>
<path d="M 130 164.0 C 230 144.0, 370 144.0, 470 164.0" fill="none" stroke="#ffd166" stroke-width="1.4" marker-end="url(#mffd166)"/>
<text x="24" y="380" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffd166" font-weight="normal" text-anchor="start">● жёлтая точка — центр клинка</text>
<text x="24" y="397" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffd166" font-weight="normal" text-anchor="start">   в тике касания (шаг 4°)</text>
<text x="24" y="418" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9aa4b8" font-weight="normal" text-anchor="start">● серая — тик без касания</text>
<text x="24" y="439" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ff7a6b" font-weight="normal" text-anchor="start">пунктир — центр клинка ближе</text>
<text x="24" y="456" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ff7a6b" font-weight="normal" text-anchor="start">18 пикс к центру врага</text>
<rect x="584" y="86" width="272" height="362" rx="10" fill="#262d3f" stroke="#5a6680" stroke-width="1.2"/>
<text x="600" y="112" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9aa4b8" font-weight="normal" text-anchor="start">касание (raylib: &lt;=)</text>
<text x="600" y="131" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#e8ebf2" font-weight="normal" text-anchor="start">центры ближе 8 + 10 = 18</text>
<text x="600" y="168" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9aa4b8" font-weight="normal" text-anchor="start">дуга касания</text>
<text x="600" y="187" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#e8ebf2" font-weight="normal" text-anchor="start">4 · asin(18/120) = 0,602 рад</text>
<text x="600" y="224" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9aa4b8" font-weight="normal" text-anchor="start">время касания</text>
<text x="600" y="243" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#e8ebf2" font-weight="normal" text-anchor="start">0,602 / (2π / 1,5) = 0,144 с</text>
<text x="600" y="280" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9aa4b8" font-weight="normal" text-anchor="start">тиков касания</text>
<text x="600" y="299" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#ffd166" font-weight="normal" text-anchor="start">0,144 · 60 = 8,6 → 8 или 9</text>
<text x="600" y="336" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9aa4b8" font-weight="normal" text-anchor="start">3 клинка, бить каждый тик</text>
<text x="600" y="355" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#ff7a6b" font-weight="normal" text-anchor="start">3 · 8,63 / 1,5 ≈ 17,3 удара/с</text>
<text x="600" y="392" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9aa4b8" font-weight="normal" text-anchor="start">3 клинка, удар за проход</text>
<text x="600" y="411" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#2ec4b6" font-weight="normal" text-anchor="start">3 / 1,5 = 2 удара/с</text></svg>
