<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">World в памяти</title><desc id="d">std::vector в World хранит указатели на массив врагов в куче; у двух миров с одинаковыми врагами адреса разные.</desc><defs><marker id="m2ec4b6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2ec4b6"/></marker><marker id="m4c9aff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4c9aff"/></marker></defs><rect x="0" y="0" width="880" height="330" rx="14" fill="#1d2230"/><text x="24" y="34" font-family="Segoe UI, Roboto, 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#e8ebf2" font-weight="bold" text-anchor="start">World в памяти: враги лежат не в нём, а в куче</text>
